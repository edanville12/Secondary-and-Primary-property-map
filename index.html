<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Busukuma Property Map</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{font-family:Arial,sans-serif;overflow:hidden}#map{background:#eef2f5}#panel{position:absolute;z-index:1000;top:10px;left:10px;width:340px;background:#fff;border-radius:9px;box-shadow:0 2px 14px #0004;padding:12px;box-sizing:border-box}#panel h2{margin:0 0 9px;font-size:19px}#search{width:100%;box-sizing:border-box;padding:9px;border:1px solid #aaa;border-radius:5px}.row{margin-top:9px;font-size:14px}#status{font-size:12px;color:#555;margin-top:8px}#results{max-height:190px;overflow:auto;margin-top:6px}.result{padding:7px;border-top:1px solid #eee;cursor:pointer;font-size:13px}.result:hover{background:#f2f2f2}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px}.prop-table td{padding:2px 7px 2px 0}#loading{position:absolute;z-index:1100;inset:0;background:#fffc;display:flex;align-items:center;justify-content:center;font-size:18px}</style></head><body><div id="loading">Loading Busukuma map…</div><div id="panel"><h2>Busukuma Property Map</h2><input id="search" placeholder="Search owner, phone, village or street"><div class="row"><label><input id="primaryToggle" type="checkbox" checked> Primary</label>&nbsp;<label><input id="secondaryToggle" type="checkbox" checked> Secondary</label></div><div class="row"><span class="dot" style="background:#e31a1c"></span>Primary&nbsp;&nbsp;<span class="dot" style="background:#16a34a"></span>Secondary</div><div id="status">Starting…</div><div id="results"></div></div><div id="map"></div><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script><script>
(function(){if(typeof L==="undefined"){document.getElementById("loading").textContent="Map library failed to load. Refresh once.";return}const map=L.map("map",{preferCanvas:true}).setView([0.45,32.45],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);const c=document.createElement("canvas"),ctx=c.getContext("2d");c.style.cssText="position:absolute;left:0;top:0;z-index:350;pointer-events:auto";map.getPanes().overlayPane.appendChild(c);let primary=[],secondary=[],pv=true,sv=true,drawn=[];const status=document.getElementById("status"),results=document.getElementById("results");const esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));function pop(r,t){return `<div><h3>${esc(r.o||"Property")}</h3><table class="prop-table"><tr><td><b>Type</b></td><td>${t}</td></tr><tr><td><b>Phone</b></td><td>${esc(r.p)}</td></tr><tr><td><b>Division</b></td><td>${esc(r.d)}</td></tr><tr><td><b>Village</b></td><td>${esc(r.v)}</td></tr><tr><td><b>Street</b></td><td>${esc(r.s)}</td></tr><tr><td><b>Latitude</b></td><td>${r.lat}</td></tr><tr><td><b>Longitude</b></td><td>${r.lon}</td></tr></table></div>`}function resize(){const s=map.getSize(),d=devicePixelRatio||1;c.width=s.x*d;c.height=s.y*d;c.style.width=s.x+"px";c.style.height=s.y+"px";ctx.setTransform(d,0,0,d,0,0);draw()}function draw(){const s=map.getSize();ctx.clearRect(0,0,s.x,s.y);drawn=[];const b=map.getBounds().pad(.12),z=map.getZoom(),rad=z>=15?4:3;function one(a,t,col){for(const r of a){if(r.lat<b.getSouth()||r.lat>b.getNorth()||r.lon<b.getWest()||r.lon>b.getEast())continue;const p=map.latLngToContainerPoint([r.lat,r.lon]);if(p.x<0||p.y<0||p.x>s.x||p.y>s.y)continue;drawn.push({x:p.x,y:p.y,r,type:t});ctx.beginPath();ctx.arc(p.x,p.y,rad,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle="#222";ctx.lineWidth=1;ctx.stroke()}}if(pv)one(primary,"Primary","#e31a1c");if(sv)one(secondary,"Secondary","#16a34a")}function show(x){map.setView([x.r.lat,x.r.lon],Math.max(map.getZoom(),17));setTimeout(()=>L.popup({maxWidth:340}).setLatLng([x.r.lat,x.r.lon]).setContent(pop(x.r,x.type)).openOn(map),150)}c.onclick=e=>{const q=c.getBoundingClientRect(),x=e.clientX-q.left,y=e.clientY-q.top;let best=null,bd=14;for(const a of drawn){const d=Math.hypot(a.x-x,a.y-y);if(d<bd){bd=d;best=a}}if(best)show(best)};map.on("moveend zoomend resize",draw);addEventListener("resize",resize);async function load(){try{status.textContent="Loading property data…";[primary,secondary]=await Promise.all(["primary.json","secondary.json"].map(f=>fetch(f+"?v=3").then(r=>{if(!r.ok)throw Error(f+" HTTP "+r.status);return r.json()})));status.textContent=`Loaded ${primary.length.toLocaleString()} Primary + ${secondary.length.toLocaleString()} Secondary properties.`;document.getElementById("loading").style.display="none";resize()}catch(e){console.error(e);document.getElementById("loading").textContent="Could not load property data.";status.textContent="Check that primary.json and secondary.json are beside index.html."}}document.getElementById("primaryToggle").onchange=e=>{pv=e.target.checked;draw()};document.getElementById("secondaryToggle").onchange=e=>{sv=e.target.checked;draw()};document.getElementById("search").oninput=function(){const q=this.value.trim().toLowerCase();results.innerHTML="";if(!q)return;const out=[];for(const[a,t]of[[primary,"Primary"],[secondary,"Secondary"]]){for(const r of a){if((r.o+" "+r.p+" "+r.v+" "+r.s+" "+r.d).toLowerCase().includes(q)){out.push({r,type:t});if(out.length>=40)break}}if(out.length>=40)break}if(!out.length){results.textContent="No matching property found.";return}for(const x of out){const d=document.createElement("div");d.className="result";d.textContent=`${x.r.o||"Unnamed"} — ${x.type} — ${x.r.v||""}`;d.onclick=()=>show(x);results.appendChild(d)}};load()})();</script></body></html>
